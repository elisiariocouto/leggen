name: Upload Python Package

on:
  push:
    tags:
      - "**"

permissions:
  contents: write
  packages: write
  id-token: write

# A tag with an rc suffix (2026.9.1rc1) is a pre-release: Docker images only,
# under the exact tag plus a floating :rc, never PyPI and never :latest.
env:
  PRERELEASE: ${{ contains(github.ref_name, 'rc') }}

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Build Package
        run: uv build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    runs-on: ubuntu-latest
    # Pre-releases are not published to PyPI.
    if: ${{ !contains(github.ref_name, 'rc') }}
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
    needs:
      - build
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # This job never checks out the repo, so there is no uv.lock to key
          # the cache on; only the uv binary itself is needed here.
          enable-cache: false
      - name: Publish package
        run: uv publish

  push-docker-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: elisiariocouto
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=false
          # list of Docker images to use as base name for tags
          images: |
            elisiariocouto/leggen
            ghcr.io/elisiariocouto/leggen
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, 'rc') }}
            type=raw,value=rc,enable=${{ contains(github.ref_name, 'rc') }}
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

  push-docker-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: elisiariocouto
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=false
          # list of Docker images to use as base name for tags
          images: |
            elisiariocouto/leggen
            ghcr.io/elisiariocouto/leggen
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=tag,suffix=-frontend
            type=semver,pattern={{version}},suffix=-frontend
            type=semver,pattern={{major}}.{{minor}},suffix=-frontend
            type=raw,value=latest-frontend,enable=${{ !contains(github.ref_name, 'rc') }}
            type=raw,value=rc-frontend,enable=${{ contains(github.ref_name, 'rc') }}
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build, publish-to-pypi, push-docker-backend, push-docker-frontend]
    # The PyPI job is skipped for pre-releases, which would skip this job too
    # under the default "all needs succeeded" rule; spell the rule out so a
    # skipped PyPI job is acceptable while a failed one still blocks.
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.push-docker-backend.result == 'success'
          && needs.push-docker-frontend.result == 'success'
          && (needs.publish-to-pypi.result == 'success' || needs.publish-to-pypi.result == 'skipped') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # cliff.toml ignores rc tags, so --current cannot see one, and with
      # HEAD sitting on the ignored tag --unreleased renders nothing. For a
      # pre-release, render the explicit range since the last final release
      # under the rc heading instead.
      - name: Find the previous final release
        if: env.PRERELEASE == 'true'
        id: previous
        run: echo "tag=$(git describe --tags --abbrev=0 --exclude='*rc*' "${GITHUB_REF_NAME}^")" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: release_notes
        with:
          config: cliff.toml
          args: ${{ env.PRERELEASE == 'true' && format('{0}..{1} --tag {1}', steps.previous.outputs.tag, github.ref_name) || '--current' }}
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.content }}
          draft: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE != 'true' }}
