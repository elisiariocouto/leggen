name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_call:

permissions:
  contents: read

jobs:
  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    # Skip the version-bump commit on branch pushes, but always run when
    # called from the release workflow (tag pushes point at that same commit)
    if: "startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, 'chore(ci): Bump version to')"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Create config directory for tests
        run: |
          mkdir -p ~/.config/leggen
          cp config.example.toml ~/.config/leggen/config.toml

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy leggen --check-untyped-defs

      - name: Run Python tests
        run: uv run pytest

  check-api-types:
    name: Check API Types
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, 'chore(ci): Bump version to')"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Regenerate OpenAPI schema and types
        run: |
          uv run python scripts/dump_openapi.py
          npm --prefix frontend run generate:api

      - name: Check for stale generated files
        run: git diff --exit-code openapi.json frontend/src/types/api.gen.ts

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, 'chore(ci): Bump version to')"
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
